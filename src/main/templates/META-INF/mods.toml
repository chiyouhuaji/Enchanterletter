# Forge 1.20.1 模组元数据（由 generateModMetadata 展开占位符）
modLoader="javafml" #mandatory

# Forge 1.20.1 的 FML 版本范围（47.x = Forge 1.20.1）
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="logo.png" #optional
authors="${mod_authors}"
description='''
${mod_description}
'''

# Mixin 配置声明（Forge 通过 mods.toml 加载 mixin）
[[mixins]]
config="${mod_id}.mixins.json"

# 依赖：Forge 本体
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

# 依赖：Minecraft
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
