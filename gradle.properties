org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft & mappings
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# NeoForge
# Compile against 21.1.243 (the newest version UsefulMagic (NeoForge) still supports).
# NeoForge patch releases within the 21.1.x line are binary compatible, so building
# against 21.1.243 lets this mod run on 21.1.243 and all earlier 21.1.x versions.
neo_version=21.1.243
neo_version_range=[21.1.0,)
loader_version_range=[2,)

# Mod metadata
mod_id=enchanter_letter
mod_name=\u9b54\u6cd5\u624b\u672d
mod_license=All Rights Reserved
mod_version=1.0.0
mod_authors=AutoForged
mod_description=Adds Enchanter Letters that boost UsefulMagic damage. Works standalone; UsefulMagic integration is optional.

# Other
maven_group=cn.autoforged.enchanter_letter
archives_base_name=enchanter_letter
